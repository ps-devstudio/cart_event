<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cart="http://typo3.org/ns/Extcode/Cart/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:section name="special-price">
    <span class="regular-price"><span class="price"></span></span>
    <span class="special-price">
        <span class="special-price"><span class="price"><cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{specialPrice.price}</cart:format.currency></span></span>
        <span class="title">{specialPrice.title}</span>
        <span class="regular-price">bisher: <span class="price"><cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{price}</cart:format.currency></span></span>
    </span>
</f:section>

<f:section name="regular-price">
    <span class="regular-price"><span class="price"><cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{price}</cart:format.currency></span></span>
    <span class="special-price">
        <span class="special-price"><span class="price"></span></span>
        <span class="title"></span>
        <span class="regular-price"><span class="price"></span></span>
    </span>
</f:section>

<f:section name="price_categorized">
    <ul class="price-categories">
        <f:for each="{eventDate.priceCategories}" as="priceCategory">
            <f:if condition="{priceCategory.available}">
                <li class="price-category" data-uid="priceCategory-{priceCategory.uid}">
                    <span class="price-category-title">{priceCategory.title}</span>
                    <f:if condition="{priceCategory.bestPrice} &lt; {priceCategory.price}">
                        <f:then>
                            <span class="price-category-special"><cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{priceCategory.bestPrice}</cart:format.currency></span>
                            <span class="price-category-regular">bisher: <cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{priceCategory.price}</cart:format.currency></span>
                        </f:then>
                        <f:else>
                            <span class="price-category-regular"><cart:format.currency currencyTranslation="{currencyTranslationData.currencyTranslation}" currencySign="{currencyTranslationData.currencySign}">{priceCategory.price}</cart:format.currency></span>
                        </f:else>
                    </f:if>
                </li>
            </f:if>
        </f:for>
    </ul>
</f:section>

<f:section name="price">
    <f:if condition="{eventDate.bestPrice} < {eventDate.price}">
        <f:then>
            <f:render partial="special-price" arguments="{price: eventDate.price, specialPrice: eventDate.bestSpecialPrice}"/>
        </f:then>
        <f:else>
            <f:render section="regular-price" arguments="{price: eventDate.price}"/>
        </f:else>
    </f:if>
</f:section>

<f:if condition="{eventDate.bookable}">
    <f:if condition="{eventDate.priceCategorized}">
        <f:then>
            <f:render section="price_categorized" arguments="{eventDate: eventDate}" />
        </f:then>
        <f:else>
            <f:render section="price" arguments="{eventDate: eventDate}" />
        </f:else>
    </f:if>
</f:if>
</html>
